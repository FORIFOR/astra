# Windows Native (WinUI 3 + C#) のビルド設定。macOS ホストでは実行不可のため CI で検証する。
# 現状 apps/windows は雛形 + GeneratedMetrics.cs のみ（実 .sln/.csproj は Phase 4 で追加）。
# この workflow は「core の C# binding 生成 → WinUI ビルド」の枠を先に固定する。
name: windows
on:
  push:
    paths: ["apps/windows/**", "core/astra-core/**", "shared/design/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design token freshness
        run: node scripts/gen-design-tokens.mjs --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build astra-core (cdylib astra_core.dll)
        working-directory: core/astra-core
        run: cargo build --release
      - name: Stage astra_core.dll for the app
        run: copy core\astra-core\target\release\astra_core.dll apps\windows\Astra\astra_core.dll
      # Windows は安定 C ABI + P/Invoke（core/astra-core/include/astra_core.h）で同じ core を使う。
      # C ABI 契約は macOS 側で `pnpm verify:c-abi` により実証済み（Windows build 自体はここで検証）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore + build WinUI 3 solution
        run: dotnet build apps/windows/Astra.sln -c Release -p:Platform=x64
      - name: Note
        run: echo "WinUI build runs on windows-latest; macOS host cannot build this (unverified there)."
