# Windows Native (WinUI 3 + C#) の CI。共有ロジック（C# CoreBridge / session / geometry）は
# どのホストでも実測済み（verify-csharp-bridge）。ここでは Windows でしかできない WinUI UI レイヤの
# 実ビルドを検証する（macOS ホストではビルド不可のため）。
name: windows
on:
  push:
    paths:
      ['apps/windows/**', 'core/astra-core/**', 'shared/design/**', '.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design token freshness
        run: node scripts/gen-design-tokens.mjs --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build astra-core (cdylib astra_core.dll)
        working-directory: core/astra-core
        run: cargo build --release
      - name: Stage astra_core.dll for the app
        run: copy core\astra-core\target\release\astra_core.dll apps\windows\Astra\astra_core.dll
      # Windows は安定 C ABI + P/Invoke（core/astra-core/include/astra_core.h）で同じ core を使う。
      # C ABI 契約は macOS 側で `pnpm verify:c-abi` により実証済み（Windows build 自体はここで検証）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: C ABI contract (Rust <-> header <-> C# P/Invoke)
        run: node scripts/check-cabi-csharp.mjs
      - name: Recording Workspace shape fixture freshness
        run: node scripts/gen-workspace-fixture.mjs --check
      - name: C# CoreBridge -> core P/Invoke smoke
        run: bash scripts/verify-csharp-bridge.sh
      - name: WinUI XAML well-formed
        run: bash scripts/check-xaml-wellformed.sh
      - name: Windows C# logic type-check (Window code-behind)
        run: bash scripts/verify-csharp-logic.sh
      - name: Restore + build WinUI 3 solution
        run: dotnet build apps/windows/Astra.sln -c Release -p:Platform=x64 -v normal
      # 実行時スモーク: 実際に Astra.exe を起動し、WinUI ブートストラップ + ウィンドウ生成が
      # クラッシュせず立ち上がることを実測する（unpackaged なので WindowsAppRuntime を同梱する
      # self-contained publish を使う）。プライマリ画面のスクショを証跡として artifact にする。
      - name: Publish self-contained (bundles WindowsAppSDK runtime)
        run: dotnet publish apps/windows/Astra/Astra.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o publish
      - name: Runtime smoke (launch each surface, verify + screenshot)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/Astra.exe").Path
          if (!(Test-Path $exe)) { throw "Astra.exe not found at $exe" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\astra-windows-$name.png")
          }
          # 各サーフェスを実提示 → 生存確認 → 撮影（HUD / Recording Workspace / Main）。
          $modes = @(@{ name = "hud"; arg = "" }, @{ name = "workspace"; arg = "--smoke-workspace" }, @{ name = "main"; arg = "--smoke-main" })
          $failed = @()
          foreach ($m in $modes) {
            $t0 = Get-Date
            $p = if ($m.arg) { Start-Process -FilePath $exe -ArgumentList $m.arg -PassThru } else { Start-Process -FilePath $exe -PassThru }
            Start-Sleep -Seconds 10
            Shot $m.name
            if ($p.HasExited) {
              $failed += "$($m.name)(exit=$($p.ExitCode))"
              $crash = Join-Path $env:TEMP "astra-crash.log"
              if (Test-Path $crash) { Write-Host "CRASHLOG[$($m.name)]: $(Get-Content $crash -Raw)"; Remove-Item $crash -Force }
              # クラッシュ理由を Application イベントログから拾って表示する。
              try {
                Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $t0 } -ErrorAction SilentlyContinue |
                  Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime|Windows Error' } |
                  Select-Object -First 3 | ForEach-Object { Write-Host "EVT[$($m.name)] $($_.Message.Substring(0,[Math]::Min(600,$_.Message.Length)))" }
              } catch { Write-Host "evtlog read failed: $_" }
            } else { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 2
          }
          if ($failed.Count -gt 0) { throw "surfaces crashed: $($failed -join ', ')" }
          Write-Host "SMOKE_OK: HUD / Recording Workspace / Main all launched and rendered on windows-latest"
      - name: Upload runtime smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-windows-smoke
          path: astra-windows-*.png
          if-no-files-found: ignore
      - name: Note
        run: echo "WinUI build + runtime smoke run on windows-latest; macOS host cannot build this."
