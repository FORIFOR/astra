# Windows Native (WinUI 3 + C#) の CI。共有ロジック（C# CoreBridge / session / geometry）は
# どのホストでも実測済み（verify-csharp-bridge）。ここでは Windows でしかできない WinUI UI レイヤの
# 実ビルドを検証する（macOS ホストではビルド不可のため）。
name: windows
on:
  push:
    paths: ["apps/windows/**", "core/astra-core/**", "shared/design/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design token freshness
        run: node scripts/gen-design-tokens.mjs --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build astra-core (cdylib astra_core.dll)
        working-directory: core/astra-core
        run: cargo build --release
      - name: Stage astra_core.dll for the app
        run: copy core\astra-core\target\release\astra_core.dll apps\windows\Astra\astra_core.dll
      # Windows は安定 C ABI + P/Invoke（core/astra-core/include/astra_core.h）で同じ core を使う。
      # C ABI 契約は macOS 側で `pnpm verify:c-abi` により実証済み（Windows build 自体はここで検証）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: C ABI contract (Rust <-> header <-> C# P/Invoke)
        run: node scripts/check-cabi-csharp.mjs
      - name: Recording Workspace shape fixture freshness
        run: node scripts/gen-workspace-fixture.mjs --check
      - name: C# CoreBridge -> core P/Invoke smoke
        run: bash scripts/verify-csharp-bridge.sh
      - name: WinUI XAML well-formed
        run: bash scripts/check-xaml-wellformed.sh
      - name: Windows C# logic type-check (Window code-behind)
        run: bash scripts/verify-csharp-logic.sh
      - name: Restore + build WinUI 3 solution
        run: dotnet build apps/windows/Astra.sln -c Release -p:Platform=x64
      - name: Note
        run: echo "WinUI build runs on windows-latest; macOS host cannot build this (unverified there)."
