# Windows Native (WinUI 3 + C#) の CI。共有ロジック（C# CoreBridge / session / geometry）は
# どのホストでも実測済み（verify-csharp-bridge）。ここでは Windows でしかできない WinUI UI レイヤの
# 実ビルドを検証する（macOS ホストではビルド不可のため）。
name: windows
on:
  push:
    paths:
      ['apps/windows/**', 'core/astra-core/**', 'shared/design/**', '.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design token freshness
        run: node scripts/gen-design-tokens.mjs --check
      - uses: dtolnay/rust-toolchain@stable
      - name: Build astra-core (cdylib astra_core.dll)
        working-directory: core/astra-core
        run: cargo build --release
      - name: Stage astra_core.dll for the app
        run: copy core\astra-core\target\release\astra_core.dll apps\windows\Astra\astra_core.dll
      # Windows は安定 C ABI + P/Invoke（core/astra-core/include/astra_core.h）で同じ core を使う。
      # C ABI 契約は macOS 側で `pnpm verify:c-abi` により実証済み（Windows build 自体はここで検証）。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: C ABI contract (Rust <-> header <-> C# P/Invoke)
        run: node scripts/check-cabi-csharp.mjs
      - name: Recording Workspace shape fixture freshness
        run: node scripts/gen-workspace-fixture.mjs --check
      - name: C# CoreBridge -> core P/Invoke smoke
        run: bash scripts/verify-csharp-bridge.sh
      - name: WinUI XAML well-formed
        run: bash scripts/check-xaml-wellformed.sh
      - name: Windows C# logic type-check (Window code-behind)
        run: bash scripts/verify-csharp-logic.sh
      - name: Restore + build WinUI 3 solution
        run: dotnet build apps/windows/Astra.sln -c Release -p:Platform=x64 -v normal
      # 実行時スモーク: 実際に Astra.exe を起動し、WinUI ブートストラップ + ウィンドウ生成が
      # クラッシュせず立ち上がることを実測する（unpackaged なので WindowsAppRuntime を同梱する
      # self-contained publish を使う）。プライマリ画面のスクショを証跡として artifact にする。
      - name: Publish self-contained (bundles WindowsAppSDK runtime)
        run: dotnet publish apps/windows/Astra/Astra.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o publish
      - name: Runtime smoke (launch Astra.exe, verify it initializes)
        shell: pwsh
        run: |
          $exe = "publish/Astra.exe"
          if (!(Test-Path $exe)) { throw "Astra.exe not found at $exe" }
          $p = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\astra-windows-smoke.png")
          $alive = -not $p.HasExited
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($alive) {
            Write-Host "SMOKE_OK: Astra.exe stayed alive 12s (WinUI bootstrap + window created)"
          } else {
            throw "Astra.exe exited early with code $($p.ExitCode)"
          }
      - name: Upload runtime smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-windows-smoke
          path: astra-windows-smoke.png
          if-no-files-found: ignore
      - name: Note
        run: echo "WinUI build + runtime smoke run on windows-latest; macOS host cannot build this."
