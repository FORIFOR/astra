# 録音で守ること。正本 §11.3・§22。
id: meeting-recording
profiles: []
rules:
  - id: confirm-before-sharing
    description: 会議の記録を外へ出すときは確認を取る
    when: { when: risk_at_least, risk: EXTERNAL_COMMIT }
    require: confirmation
    severity: block
  - id: recording-stays-local-until-asked
    description: 録音の破壊的操作は自律的に行わない
    when: { when: risk_at_least, risk: DESTRUCTIVE }
    require: deny
    severity: block
