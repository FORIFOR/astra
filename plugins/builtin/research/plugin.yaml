# Core Agent Plugin (built-in, non-removable) — product spec §2.2, §8
id: com.astra.research
name: Research Agent
version: 0.1.0
publisher: astra
verified: true
min_core_version: 0.1.0
category: domain-agent
builtin: true
removable: false
compliance_profile: GENERAL
execution_surfaces: [cloud]
permissions:
  - web.search
  - web.fetch
  - artifacts.write
jobs:
  - 調べて報告する
  - 根拠を残す
data_accessed:
  - この調査で取りに行く公開の Web ページ
  - 利用者が明示的に指した Library の成果物
connectors: []
agents:
  - id: research
    skill: skills/research.md
    tools: [web.search, web.fetch, evidence.record, report.compose]
dashboards:
  - id: research-runs
    schema: dashboards/research-runs.json
data_sources:
  - id: research.total
    kind: count
    query: research_runs
  - id: research.contradicted
    kind: count
    query: research_contradicted
  - id: research.by_confidence
    kind: series
    query: research_by_confidence
  - id: research.recent
    kind: rows
    query: research_recent
policies:
  - policies/research-sources.yaml
