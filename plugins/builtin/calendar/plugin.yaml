# Connector Plugin — product spec §2.4
id: com.astra.google-calendar
name: Google Calendar
version: 0.1.0
publisher: astra
verified: true
min_core_version: 0.1.0
category: connector
compliance_profile: GENERAL
# 端末で走る。**資格情報は端末の Keychain にしかない**ので、
# cloud で呼べる道は作らない（正本 §16.1・§21）。
execution_surfaces: [local]
permissions:
  - calendar.read
  - calendar.write
jobs:
  - 予定を読む
  - 予定を作る（確認あり）
data_accessed:
  - 予定の内容・参加者・場所・会議リンク
# 同意は capability 単位で 2 回に分ける（read-only first）。
#   google-calendar          読むだけ。Work Context と Home の「これからの予定」はこれだけで動く
#   google-calendar-actions  予定を作る（招待が相手へ届く）。作る操作が要ったときに初めて求める
connectors:
  - id: google-calendar
    auth: oauth2
    provider: google
    grants:
      - calendar.read
    purpose: 予定の題名・時間・参加者を読んで、今週の負荷と会議の準備に使う。予定は変えない
    scopes:
      - https://www.googleapis.com/auth/calendar.readonly
  - id: google-calendar-actions
    auth: oauth2
    provider: google
    grants:
      - calendar.write
    purpose: あなたが承認した予定を作る（招待が同席者へ届く）
    scopes:
      - https://www.googleapis.com/auth/calendar.events
tools:
  - id: calendar.list_events
    surface: local
    risk: READ
  - id: calendar.get_event
    surface: local
    risk: READ
  # 招待が同席者へ届く。取り消しても「取り消し通知」が届く。
  - id: calendar.create_event
    surface: local
    risk: EXTERNAL_COMMIT
    requires_confirmation: true
agents: []
dashboards: []
policies: []
