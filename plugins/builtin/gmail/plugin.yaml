# Connector Plugin — product spec §2.4
id: com.astra.gmail
name: Gmail
version: 0.1.0
publisher: astra
verified: true
min_core_version: 0.1.0
category: connector
compliance_profile: GENERAL
# 端末で走る。**資格情報は端末の Keychain にしかない**ので、
# cloud で呼べる道は作らない（正本 §16.1・§21）。
execution_surfaces: [local]
permissions:
  - email.read
  - email.draft
  - email.modify
  - email.send
jobs:
  - メールを探して読む
  - 返信の下書きを作る
data_accessed:
  - Gmail messages, threads, labels and drafts
  - Contact names and addresses appearing in those messages
connectors:
  - id: gmail
    auth: oauth2
    provider: google
    scopes:
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.send
tools:
  - id: mail.search
    surface: local
    risk: READ
  - id: mail.read
    surface: local
    risk: READ
  - id: mail.draft.create
    surface: local
    risk: REVERSIBLE_WRITE
  - id: mail.send
    surface: local
    risk: EXTERNAL_COMMIT
    requires_confirmation: true
  - id: mail.trash
    surface: local
    risk: DESTRUCTIVE
    requires_confirmation: true
agents:
  # 読んで、下書きまで。**送信は tools に入れない** —
  # 入れると、承認は通るにせよ「agent が送れる」形になる。
  # 送るかどうかは人が決めることなので、そもそも持たせない。
  - id: mail-assistant
    skill: skills/mail.md
    tools: [mail.search, mail.read, mail.draft.create]
    workflow: workflows/triage.yaml
dashboards: []
policies: []
