[package]
name = "astra-desktop"
version = "0.1.1"
description = "Astra desktop client (Local Control Plane)"
authors = ["Astra"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "astra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: 透過した Dock window に必要（tauri.conf.json の macOSPrivateApi と対）
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
# OS の資格情報ストア。refresh token を平文で置かないため（正本 §21）
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-notification = "2"
cpal = "0.15"
rubato = "0.15"
libloading = "0.8"
dirs = "5"
# 会議の音声を gateway へ送る WebSocket（Authorization ヘッダ付きの upgrade は webview からは張れない）
tungstenite = { version = "0.24", features = ["native-tls"] }
base64 = "0.22"
# OS 非依存の共通ロジック（会議の断片モデル・wire 変換・回復）。二重実装を避ける（§8）
astra-core = { path = "../../../core/astra-core" }
