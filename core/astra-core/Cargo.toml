[package]
name = "astra-core"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"
description = "Astra の OS 非依存な共通ロジック（会議の状態・録音の断片モデル・表示派生）。UI framework を知らない。"

[lib]
name = "astra_core"
# lib: Tauri など Rust から使う / staticlib+cdylib: UniFFI が Swift/C# 用に読む
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
# UniFFI の bindings 生成器。`cargo run --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# gateway API（実バックエンド）を叩く軽量 HTTP。OS 非依存の API/domain 処理を core に置く
ureq = { version = "2", features = ["json"] }
# 会議音声の WS 送信（gateway /audio）。native から Tauri を介さず送るため
tungstenite = { version = "0.24", features = ["native-tls"] }
uniffi = { version = "0.29", features = ["cli"] }
# PKCE(RFC 7636)の S256 challenge を core で作る（connector 契約層）
sha2 = "0.11"

[dev-dependencies]
uniffi = { version = "0.29", features = ["bindgen-tests"] }
